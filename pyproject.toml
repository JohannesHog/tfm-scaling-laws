[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "scaling"
version = "0.1.0"
authors = [
  { name = "Neeratyoy Mallik"},
  { name = "Johannes Hog"},
]
description = "Scaling-law fits and figures of 'Towards Reliable Scaling Laws for Tabular Foundation Models'"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "seaborn",
    "joblib",
    "jupyter",
]

[tool.setuptools]
packages = ["scaling"]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "F",    # Pyflakes
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "I",    # isort
    "N",    # pep8-naming
    "PL",   # pylint
    "UP",   # pyupgrade
    "C90"   # mccabe
]
